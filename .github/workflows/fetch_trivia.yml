name: Fetch Trivia to Discord

on:
  workflow_dispatch: # Discordボタン / Cloudflare からの起動

jobs:
  fetch-and-generate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Python 環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 2. ネタ取得・Gemini/Groq台本作成 & Discordフォーラム投稿
      - name: Run Fetch & Script Generation
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FORUM_CHANNEL_ID: ${{ secrets.FORUM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/fetch_trivia.py

      # 3. バックアップ用に Artifacts (trivia_result.json) を保存
      - name: Upload Script Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivia-script-json
          path: output/
