name: Generate Video Pipeline

on:
  workflow_dispatch:
    inputs:
      thread_id:
        description: 'Discord Thread ID'
        required: false
        default: ''
  repository_dispatch:
    types: [generate_video]

jobs:
  build-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Python 環境 & FFmpeg のセットアップ
      - name: Set up Python & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg zip fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests pydub google-genai

      # 独自フォントの追加（リポジトリ変数 EXTRA_FONT_URLS に フォントttfのURL を空白区切りで列挙）
      # 例: https://github.com/google/fonts/raw/main/ofl/zenmarugothic/ZenMaruGothic-Regular.ttf
      - name: Install Custom Fonts (optional)
        env:
          EXTRA_FONT_URLS: ${{ vars.EXTRA_FONT_URLS }}
        run: |
          if [ -n "$EXTRA_FONT_URLS" ]; then
            sudo mkdir -p /usr/share/fonts/truetype/custom
            for url in $EXTRA_FONT_URLS; do
              echo "⬇️ フォント取得: $url"
              sudo curl -fsSL "$url" -o "/usr/share/fonts/truetype/custom/$(basename "$url")" \
                || echo "⚠️ 取得失敗（スキップ）: $url"
            done
            sudo fc-cache -f >/dev/null
            echo "--- fontconfig に登録されたカスタムフォント ---"
            fc-list | grep -i -E "custom|shippori" || echo "⚠️ カスタムフォントが fontconfig に認識されていません"
          else
            echo "ℹ️ EXTRA_FONT_URLS 未設定のため、追加フォントなしで続行します"
          fi

      # 2. GHCR ログイン (AivisSpeech イメージ取得用の認証)
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Docker キャッシュの復元 / 保存
      - name: Cache Docker Images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-docker-aivis-${{ hashFiles('**/generate_video.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-aivis-

      # 4. キャッシュが存在すればロード
      - name: Load cached Docker image
        run: |
          if [ -f /tmp/docker-cache/aivisspeech.tar ]; then
            echo "📦 キャッシュから Docker イメージをロード中..."
            docker load < /tmp/docker-cache/aivisspeech.tar
          fi

      # 5. AivisSpeech Engine (Docker) 起動 & ヘルスチェック待機
      - name: Start AivisSpeech Engine
        run: |
          mkdir -p ~/.local/share/AivisSpeech-Engine
          sudo chown -R 1000:1000 ~/.local/share/AivisSpeech-Engine
          
          docker run -d -p 10101:10101 \
            -v ~/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev \
            ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          
          # 初回実行時のみ次回用にキャッシュを保存
          if [ ! -f /tmp/docker-cache/aivisspeech.tar ]; then
            mkdir -p /tmp/docker-cache
            echo "💾 次回用に Docker イメージをキャッシュ保存中..."
            docker save ghcr.io/aivis-project/aivisspeech-engine:cpu-latest > /tmp/docker-cache/aivisspeech.tar
          fi

          echo "Waiting for AivisSpeech Engine to become ready..."
          for i in {1..60}; do
            if curl -s http://127.0.0.1:10101/version > /dev/null; then
              echo "✅ AivisSpeech Engine is fully initialized and ready!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          
          echo "❌ Timed out waiting for AivisSpeech Engine."
          docker logs $(docker ps -lq)
          exit 1

      # 6. 台本データの準備（Discord取得 or テスト生成）＆ 音声生成
      - name: Run Voice & Subtitle Generation
        env:
          AIVIS_URL: "http://127.0.0.1:10101"
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SUB_LINE_MAX_CHARS: ${{ vars.SUB_LINE_MAX_CHARS || '16' }}
        run: |
          python src/prepare_trivia.py
          python src/generate_voice.py

      # 6.5 manual-assets の取り込み（clips/images がある場合は output へコピー）
      - name: Prepare Manual Assets
        run: |
          mkdir -p output
          if [ -d manual-assets/clips ]; then
            mkdir -p output/clips
            cp manual-assets/clips/*.mp4 output/clips/ 2>/dev/null || true
          fi
          if [ -d manual-assets/images ]; then
            cp manual-assets/images/* output/ 2>/dev/null || true
          fi
          echo "--- output ---"
          ls -la output || true

      # 6.6 スレッドに添付された素材（clip_XX.mp4 / scene_XX.jpg）を自動取得
      - name: Fetch Attachments from Discord Thread
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
        run: |
          python src/fetch_discord_assets.py

      # 7. 背景画像生成 (manual-assets / Discord添付素材 が存在する場合はスキップ)
      - name: Generate Images (skip when manual assets exist)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          if [ -n "$(find manual-assets -type f 2>/dev/null | head -1)" ]; then
            echo "📄 manual-assets が存在するため自動画像生成をスキップします"
          elif [ -n "$(find output/clips -type f 2>/dev/null | head -1)" ]; then
            echo "🎬 Discord 添付のクリップが存在するため自動画像生成をスキップします"
          elif ls output/scene_*.* >/dev/null 2>&1; then
            echo "🖼️ Discord 添付の画像が存在するため自動画像生成をスキップします"
          else
            python src/generate_image.py
          fi

      # 8. FFmpeg による仮組み動画生成
      - name: Build Draft Video
        env:
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SUB_FONT_NAME: ${{ vars.SUB_FONT_NAME || 'Noto Sans CJK JP' }}
          SUB_FONT_SIZE: ${{ vars.SUB_FONT_SIZE || '20' }}
          SUB_FONT_FILE: ${{ vars.SUB_FONT_FILE }}
          TITLE_FONT_FILE: ${{ vars.TITLE_FONT_FILE }}
          TITLE_FONT_SIZE: ${{ vars.TITLE_FONT_SIZE || '72' }}
          TITLE_INTRO_SEC: ${{ vars.TITLE_INTRO_SEC || '3' }}
          UPLOAD_TARGET_MB: ${{ vars.UPLOAD_TARGET_MB || '7.5' }}
        run: |
          echo "━━ フォント設定の確認 ━━"
          echo "SUB_FONT_NAME=$SUB_FONT_NAME"
          echo "SUB_FONT_FILE=$SUB_FONT_FILE"
          echo "TITLE_FONT_FILE=$TITLE_FONT_FILE"
          echo "SUB_FONT_SIZE=$SUB_FONT_SIZE"
          fc-list | grep -i "shippori" || echo "(Shippori 関連フォントが fontconfig に無い)"
          python src/generate_video.py

      # 9. 成果物を Zip にまとめて Artifacts へ保存
      - name: Create Zip Artifact
        run: |
          cd output
          zip -r ../video_assets.zip ./*

      - name: Upload Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-draft-assets
          path: video_assets.zip

      # 10. 失敗時の通知（どこまで進んだか Discord で分かるように）
      - name: Notify Failure
        if: failure()
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
        run: |
          python -c "
          from discord_notifier import send_to_discord
          send_to_discord('❌ **【エラー通知】動画作成パイプラインが途中で失敗しました。**\nGitHub Actions のログを確認してください（失敗したステップ名＋最後の20行を共有してください）。')
          "
