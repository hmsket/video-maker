name: Generate Video Pipeline

on:
  workflow_dispatch:
    inputs:
      thread_id:
        description: 'Discord Thread ID'
        required: false
        default: ''
  repository_dispatch:
    types: [generate_video]

jobs:
  build-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Python 環境 & FFmpeg のセットアップ
      - name: Set up Python & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg zip
          python -m pip install --upgrade pip
          pip install requests pydub google-genai

      # 2. GHCR ログイン (AivisSpeech イメージ取得用の認証)
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Docker キャッシュの復元 / 保存
      - name: Cache Docker Images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-docker-aivis-${{ hashFiles('**/generate_video.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-aivis-

      # 4. キャッシュが存在すればロード
      - name: Load cached Docker image
        run: |
          if [ -f /tmp/docker-cache/aivisspeech.tar ]; then
            echo "📦 キャッシュから Docker イメージをロード中..."
            docker load < /tmp/docker-cache/aivisspeech.tar
          fi

      # 5. AivisSpeech Engine (Docker) 起動 & ヘルスチェック待機
      - name: Start AivisSpeech Engine
        run: |
          mkdir -p ~/.local/share/AivisSpeech-Engine
          sudo chown -R 1000:1000 ~/.local/share/AivisSpeech-Engine
          
          docker run -d -p 10101:10101 \
            -v ~/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev \
            ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          
          # 初回実行時のみ次回用にキャッシュを保存
          if [ ! -f /tmp/docker-cache/aivisspeech.tar ]; then
            mkdir -p /tmp/docker-cache
            echo "💾 次回用に Docker イメージをキャッシュ保存中..."
            docker save ghcr.io/aivis-project/aivisspeech-engine:cpu-latest > /tmp/docker-cache/aivisspeech.tar
          fi

          echo "Waiting for AivisSpeech Engine to become ready..."
          for i in {1..60}; do
            if curl -s http://127.0.0.1:10101/version > /dev/null; then
              echo "✅ AivisSpeech Engine is fully initialized and ready!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          
          echo "❌ Timed out waiting for AivisSpeech Engine."
          docker logs $(docker ps -lq)
          exit 1

      # 6. 台本データの準備（Discord取得 or テスト生成）＆ 音声生成
      - name: Run Voice & Subtitle Generation
        env:
          AIVIS_URL: "http://127.0.0.1:10101"
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python src/prepare_trivia.py
          python src/generate_voice.py

      # 7. 背景画像生成 (Imagen 3)
      - name: Generate Images with Imagen 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python src/generate_image.py

      # 8. FFmpeg による仮組み動画生成
      - name: Build Draft Video
        env:
          THREAD_ID: ${{ github.event.inputs.thread_id || github.event.client_payload.thread_id }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python src/generate_video.py

      # 9. 成果物を Zip にまとめて Artifacts へ保存
      - name: Create Zip Artifact
        run: |
          cd output
          zip -r ../video_assets.zip ./*

      - name: Upload Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-draft-assets
          path: video_assets.zip
